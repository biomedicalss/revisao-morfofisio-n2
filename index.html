<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão de provas</title>
<style>
:root{--bg:#f1f4f9;--card:#fff;--ink:#14213d;--mute:#5b6478;--line:#d6dce8;--acc:#2f5bea;--ok:#17734f;--okbg:#e3f4ec;--bad:#b3363b;--badbg:#fbe9ea}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#18202e;--ink:#e8ecf5;--mute:#9aa4ba;--line:#2b364b;--acc:#7b9bff;--ok:#5fd0a0;--okbg:#14362a;--bad:#ff8a8f;--badbg:#3b1d20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:28px 20px 8px;max-width:760px;margin:0 auto}
h1{font:700 28px/1.2 Georgia,"Times New Roman",serif;margin:0}
header p{margin:4px 0 0;color:var(--mute)}
main{max-width:760px;margin:0 auto;padding:16px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){button.p{color:#10151f}}
button.d{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.meta{color:var(--mute);font-size:14px;display:flex;justify-content:space-between;gap:10px}
.bar{height:4px;background:var(--line);border-radius:2px;margin:8px 0 16px}.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.q{font:19px/1.5 Georgia,"Times New Roman",serif;white-space:pre-wrap;margin:0 0 14px}
.q-img{max-width:100%;max-height:360px;display:block;margin:0 auto 16px;border-radius:6px;border:1px solid var(--line)}
.opt{display:flex;gap:12px;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;align-items:flex-start}
.opt b{min-width:1.4em}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.exp{background:var(--bg);border-left:4px solid var(--acc);padding:10px 14px;margin-top:12px;border-radius:0 6px 6px 0;white-space:pre-wrap}
.score{font:700 44px/1 Georgia,serif;margin:6px 0}
.note{background:var(--okbg);border:1px solid var(--ok);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item small{color:var(--mute);display:block}
.hint{font-size:13px;color:var(--mute);margin-top:4px}
.prev{max-width:200px;max-height:120px;margin-top:8px;border-radius:6px;display:block}
</style>
</head>
<body>
<header>
  <h1 id="title">Revisão de provas</h1>
  <p id="sub">Pratique com questões de alternativas e veja a explicação de cada resposta.</p>
</header>
<main id="app"></main>

<script>
// Questões de exemplo (usadas só se questions.json não for encontrado)
const SAMPLE=[
 {disciplina:"Exemplo",tema:"Teste",enunciado:"Qual é a capital do Brasil?",imagem:"",alternativas:["Rio de Janeiro","Brasília","São Paulo","Salvador"],correta:1,explicacao:"Brasília é a capital federal desde 1960."},
 {disciplina:"Exemplo",tema:"Teste",enunciado:"Quanto é 7 × 8?",imagem:"",alternativas:["54","56","58","64"],correta:1,explicacao:"7 × 8 = 56."}
];

const admin=new URLSearchParams(location.search).has("admin");
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L="ABCDEFGH";
let Q=[],S=null,editing=-1;

async function load(){
  let d=null;
  if(admin){try{d=JSON.parse(localStorage.getItem("rev_draft"))}catch(e){}}
  if(!d){try{const r=await fetch("questions.json",{cache:"no-store"});if(r.ok)d=await r.json()}catch(e){}}
  Q=Array.isArray(d)&&d.length?d:SAMPLE;
  admin?adminView():home();
}
const save=()=>{try{localStorage.setItem("rev_draft",JSON.stringify(Q))}catch(e){}};

/* ---------- ALUNO ---------- */
function home(){
  const subs=[...new Set(Q.map(q=>q.disciplina).filter(Boolean))];
  app.innerHTML=`<div class="card">
    <label for="f-d">Disciplina</label>
    <select id="f-d"><option value="">Todas (${Q.length} questões)</option>${subs.map(s=>`<option>${esc(s)}</option>`).join("")}</select>
    <label for="f-t">Tema</label>
    <select id="f-t"><option value="">Todos</option></select>
    <label for="f-n">Quantidade de questões</label>
    <input id="f-n" type="number" min="1" value="10">
    <label style="font-weight:400;display:flex;gap:8px;align-items:center"><input id="f-s" type="checkbox" checked style="width:auto"> Embaralhar a ordem das questões</label>
    <div class="row"><button class="p" id="go">Começar revisão</button></div>
  </div>`;
  const fd=$("#f-d"),ft=$("#f-t");
  const fillT=()=>{const t=[...new Set(Q.filter(q=>!fd.value||q.disciplina===fd.value).map(q=>q.tema).filter(Boolean))];
    ft.innerHTML='<option value="">Todos</option>'+t.map(x=>`<option>${esc(x)}</option>`).join("")};
  fd.onchange=fillT;fillT();
  $("#go").onclick=()=>{
    let l=Q.filter(q=>(!fd.value||q.disciplina===fd.value)&&(!ft.value||q.tema===ft.value));
    if(!l.length)return alert("Nenhuma questão para esse filtro.");
    if($("#f-s").checked)l=[...l].sort(()=>Math.random()-.5);
    l=l.slice(0,Math.max(1,+$("#f-n").value||10));
    start(l);
  };
}
function start(list){S={list,i:0,score:0,wrong:[]};ask()}
function ask(){
  const q=S.list[S.i],n=S.list.length;
  app.innerHTML=`<div class="card">
    <div class="meta"><span>Questão ${S.i+1} de ${n}</span><span>${esc(q.disciplina||"")}${q.tema?" · "+esc(q.tema):""}</span></div>
    <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
    <p class="q">${esc(q.enunciado)}</p>
    ${q.imagem?`<img class="q-img" src="${esc(q.imagem)}" alt="Imagem da questão" onerror="this.style.display='none'">`:""}
    <div id="opts">${q.alternativas.map((a,i)=>`<button class="opt" data-i="${i}"><b>${L[i]})</b><span>${esc(a)}</span></button>`).join("")}</div>
    <div id="fb"></div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
  const q=S.list[S.i],ok=i===q.correta;
  document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===q.correta)b.classList.add("ok");else if(k===i)b.classList.add("bad")});
  if(ok)S.score++;else S.wrong.push(q);
  const last=S.i===S.list.length-1;
  $("#fb").innerHTML=`<p><b style="color:var(--${ok?"ok":"bad"})">${ok?"Correto.":"Incorreto. A resposta certa é a "+L[q.correta]+"."}</b></p>
    ${q.explicacao?`<div class="exp">${esc(q.explicacao)}</div>`:""}
    <div class="row"><button class="p" id="nx">${last?"Ver resultado":"Próxima questão"}</button></div>`;
  $("#nx").focus();
  $("#nx").onclick=()=>{if(last)result();else{S.i++;ask()}};
}
function result(){
  const n=S.list.length,pct=Math.round(S.score/n*100);
  app.innerHTML=`<div class="card"><div class="meta">Resultado</div>
    <div class="score">${S.score}/${n} <span style="font-size:20px;color:var(--mute)">(${pct}%)</span></div>
    <div class="row">${S.wrong.length?`<button class="p" id="rw">Refazer as ${S.wrong.length} que errei</button>`:""}<button id="hm">Nova revisão</button></div></div>
    ${S.wrong.length?`<div class="card"><b>Para revisar</b>${S.wrong.map(q=>`<div class="item"><div>${esc(q.enunciado.slice(0,140))}${q.enunciado.length>140?"…":""}<small>Resposta certa: ${L[q.correta]}) ${esc(q.alternativas[q.correta])}</small></div></div>`).join("")}</div>`:""}`;
  if($("#rw"))$("#rw").onclick=()=>start(S.wrong);
  $("#hm").onclick=home;
}

/* ---------- ADMIN (?admin na URL) ---------- */
function adminView(){
  $("#title").textContent="Painel do professor";
  $("#sub").textContent="Edite as questões aqui, baixe o questions.json e envie ao GitHub para publicar.";
  app.innerHTML=`<div class="note">Alterações ficam salvas só neste navegador (rascunho). Os alunos só veem o que estiver no <b>questions.json</b> do GitHub.</div>
  <div class="card"><div class="row" style="margin-top:0">
    <button class="p" id="new">+ Nova questão</button>
    <button id="exp">Baixar questions.json</button>
    <label style="margin:0;font-weight:400"><input id="imp" type="file" accept=".json" hidden><span class="btn" style="cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:9px 16px;display:inline-block">Importar JSON</span></label>
    <a href="${location.pathname}" style="margin-left:auto">Ver como aluno</a></div></div>
  <div class="card" id="form" hidden></div>
  <div class="card"><b>${Q.length} questões</b><div id="list"></div></div>`;
  list();
  $("#new").onclick=()=>edit(-1);
  $("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(Q,null,2)],{type:"application/json"}));a.download="questions.json";a.click()};
  $("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d))throw 0;Q=d;save();adminView()}catch(x){alert("Arquivo JSON inválido.")}})};
}
function list(){
  $("#list").innerHTML=Q.map((q,i)=>`<div class="item"><div>${esc(q.enunciado.slice(0,100))}${q.enunciado.length>100?"…":""}<small>${esc(q.disciplina||"sem disciplina")}${q.tema?" · "+esc(q.tema):""}${q.imagem?" · com imagem":""}</small></div>
    <div class="row" style="margin:0"><button data-e="${i}">Editar</button><button class="d" data-x="${i}">Excluir</button></div></div>`).join("");
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(+b.dataset.e));
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{if(confirm("Excluir esta questão?")){Q.splice(+b.dataset.x,1);save();adminView()}});
}
function edit(i){
  editing=i;
  const q=i>=0?Q[i]:{disciplina:(Q[Q.length-1]||{}).disciplina||"",tema:"",enunciado:"",imagem:"",alternativas:["","","",""],correta:0,explicacao:""};
  const f=$("#form");f.hidden=false;
  f.innerHTML=`<b>${i>=0?"Editar questão":"Nova questão"}</b>
   <label for="e-d">Disciplina</label><input id="e-d" value="${esc(q.disciplina)}">
   <label for="e-t">Tema</label><input id="e-t" value="${esc(q.tema)}">
   <label for="e-q">Enunciado</label><textarea id="e-q">${esc(q.enunciado)}</textarea>
   <label for="e-i">Imagem (opcional)</label><input id="e-i" value="${esc(q.imagem)}" placeholder="images/figura1.png">
   <input id="e-f" type="file" accept="image/*" style="margin-top:6px">
   <div class="hint">Escolha o arquivo para pré-visualizar e preencher o nome. Depois envie esse arquivo para a pasta <b>images</b> do GitHub.</div>
   <img id="pv" class="prev" alt="" ${q.imagem?`src="${esc(q.imagem)}"`:"hidden"} onerror="this.hidden=true">
   <label for="e-a">Alternativas (uma por linha, sem a letra)</label><textarea id="e-a">${esc(q.alternativas.join("\n"))}</textarea>
   <label for="e-c">Alternativa correta</label><select id="e-c"></select>
   <label for="e-x">Explicação (aparece após responder)</label><textarea id="e-x">${esc(q.explicacao)}</textarea>
   <div class="row"><button class="p" id="sv">Salvar questão</button><button id="cx">Cancelar</button></div>`;
  const sel=$("#e-c"),ta=$("#e-a");
  const fill=()=>{const n=Math.max(2,ta.value.split("\n").filter(x=>x.trim()).length);const cur=+sel.value||q.correta||0;
    sel.innerHTML=Array.from({length:n},(_,k)=>`<option value="${k}" ${k===cur?"selected":""}>${L[k]}</option>`).join("")};
  ta.oninput=fill;fill();sel.value=q.correta;
  $("#e-f").onchange=e=>{const file=e.target.files[0];if(!file)return;$("#e-i").value="images/"+file.name;const p=$("#pv");p.src=URL.createObjectURL(file);p.hidden=false};
  $("#cx").onclick=()=>{f.hidden=true};
  $("#sv").onclick=()=>{
    const alts=ta.value.split("\n").map(x=>x.trim()).filter(Boolean);
    if(!$("#e-q").value.trim()||alts.length<2)return alert("Preencha o enunciado e ao menos 2 alternativas.");
    const nq={disciplina:$("#e-d").value.trim(),tema:$("#e-t").value.trim(),enunciado:$("#e-q").value.trim(),imagem:$("#e-i").value.trim(),alternativas:alts,correta:Math.min(+sel.value,alts.length-1),explicacao:$("#e-x").value.trim()};
    if(editing>=0)Q[editing]=nq;else Q.push(nq);
    save();adminView();
  };
  f.scrollIntoView({behavior:"smooth"});
}
load();
</script>
</body>
</html>
