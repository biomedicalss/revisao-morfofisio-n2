<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#294f9a"><title>Revisão de Morfofisiologia N2</title><style>
:root{color-scheme:light;--bg:#eef3fb;--card:#fff;--ink:#1d2e48;--mute:#607189;--line:#dae2ef;--acc:#335fbd;--ok:#176746;--bad:#a93449}*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#eef3fb,#f8fbff);font:16px/1.55 system-ui,Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#183f81,#4675ca);padding:30px 18px;color:white}header>div{max-width:860px;margin:auto}h1{font-size:clamp(25px,5vw,37px);margin:0}header p{margin:5px 0 0;color:#e5efff}main{max-width:860px;margin:22px auto 90px;padding:0 16px}.panel,.question{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 20px #29476e0b;padding:20px;margin-bottom:16px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}.filter{padding:10px;border-radius:9px;border:1px solid var(--line);background:#fff;min-width:215px;font:inherit}.muted{color:var(--mute)}.tag{display:inline-block;padding:3px 10px;border-radius:30px;background:#e9efff;color:#325492;font-size:13px;font-weight:700}.q-title{font-size:18px;margin:12px 0;font-weight:650;white-space:pre-line}.q-img{display:block;max-width:100%;width:auto;max-height:370px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fafcff;margin:16px auto;padding:8px}.choice{display:flex;gap:12px;width:100%;text-align:left;align-items:flex-start;padding:12px 13px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:inherit;cursor:pointer}.choice b{min-width:24px;color:#3c61a3}.choice:not(:disabled):hover{border-color:var(--acc);background:#f5f8ff}.choice:disabled{cursor:default;color:inherit}.choice.correct{background:#dff3e9;border-color:#1f8e60}.choice.incorrect{background:#fbe9ea;border-color:#b94556}.feedback{margin-top:14px;border-left:4px solid var(--acc);background:#f1f5fc;border-radius:6px;padding:14px;white-space:pre-line}.feedback strong{display:block;margin-bottom:8px}.answer{display:block;width:100%;height:126px;padding:12px;font:inherit;border:1px solid var(--line);border-radius:10px;resize:vertical}.action{border:0;border-radius:9px;background:var(--acc);color:white;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}.action.secondary{background:#e9eff9;color:#274b87}.progress{height:8px;border-radius:9px;background:#e2e8f4;overflow:hidden;margin:12px 0}.progress span{display:block;background:linear-gradient(90deg,#3b75dd,#45b7b2);height:100%;transition:width .2s}#summary{font-size:14px}.footer{text-align:center;color:var(--mute);font-size:13px;padding:30px}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #80a9f8;outline-offset:2px}@media(max-width:600px){.panel,.question{padding:16px}.choice{padding:11px 10px}}
</style></head><body><header><div><h1>Revisão de Morfofisiologia — N2</h1><p>Sistema muscular • Sistema tegumentar • Sistema cardiovascular</p></div></header><main><section class="panel"><div class="toolbar"><div><strong>Simulado interativo com 35 questões</strong><div class="muted" id="summary">Preparando questões...</div></div><select class="filter" id="filter" aria-label="Filtrar por sistema"><option value="all">Todos os sistemas</option><option value="Sistema muscular">Sistema muscular</option><option value="Sistema tegumentar">Sistema tegumentar</option><option value="Sistema cardiovascular">Sistema cardiovascular</option></select></div><div class="progress"><span id="progress" style="width:0%"></span></div><button class="action secondary" id="reset">Recomeçar a revisão</button></section><div id="questions"></div><p class="footer">Material de revisão e estudo • As imagens são ilustrativas, incluindo modelos e esquemas anatômicos.</p></main><script>
let data=[],answers={};const qs=document.getElementById('questions'),filter=document.getElementById('filter');const letters='ABCDE';function clean(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}function progress(){const done=Object.keys(answers).length;const answered=Object.entries(answers).filter(([i,v])=>data[+i].tipo!=='discursiva');const correct=answered.filter(([i,v])=>v===data[+i].correta).length;document.getElementById('summary').textContent=`${done}/${data.length} respondidas • ${correct}/${answered.length} acertos nas objetivas`;document.getElementById('progress').style.width=(done/data.length*100)+'%';}function render(){let out='';data.forEach((q,i)=>{if(filter.value!=='all'&&filter.value!==q.tema)return;const saved=answers[i];const done=saved!==undefined;const num=i+1;out+=`<article class="question" id="q-${i}"><span class="tag">Questão ${String(num).padStart(2,'0')} · ${clean(q.tema)}</span><p class="q-title">${clean(q.enunciado)}</p>${q.imagem?`<img class="q-img" loading="lazy" src="${encodeURI(q.imagem)}" alt="Ilustração anatômica para a questão ${num}" onerror="this.replaceWith(document.createTextNode('Imagem não encontrada: '+this.getAttribute('src')))">`:''}`;if(q.tipo==='discursiva'){out+=`<textarea class="answer" id="a-${i}" aria-label="Resposta da questão ${num}" placeholder="Escreva sua resposta antes de conferir a resposta-modelo">${done?clean(saved):''}</textarea><button class="action" data-reveal="${i}">${done?'Ver resposta-modelo':'Conferir resposta-modelo'}</button>`;}else{q.alternativas.forEach((opt,j)=>{let cl=done?(j===q.correta?' correct':j===saved?' incorrect':''):'';out+=`<button class="choice${cl}" data-q="${i}" data-opt="${j}" ${done?'disabled':''}><b>${letters[j]})</b><span>${clean(opt)}</span></button>`;});}if(done)out+=`<div class="feedback"><strong>${q.tipo==='discursiva'?'Resposta-modelo para comparação':saved===q.correta?'✓ Correto!':'✗ Resposta incorreta · Alternativa correta: '+letters[q.correta]}</strong>${clean(q.explicacao)}</div>`;out+='</article>';});qs.innerHTML=out;progress();}qs.addEventListener('click',e=>{const b=e.target.closest('[data-opt],[data-reveal]');if(!b)return;if(b.dataset.opt!==undefined){const i=+b.dataset.q;if(answers[i]!==undefined)return;answers[i]=+b.dataset.opt;}else{const i=+b.dataset.reveal;answers[i]=document.getElementById('a-'+i).value.trim();}render();document.getElementById('q-'+(b.dataset.opt!==undefined?b.dataset.q:b.dataset.reveal))?.scrollIntoView({block:'nearest'});});filter.addEventListener('change',render);document.getElementById('reset').addEventListener('click',()=>{if(confirm('Apagar suas respostas e recomeçar?')){answers={};render();window.scrollTo(0,0)}});fetch('questions.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Não foi possível carregar questions.json');return r.json()}).then(q=>{data=q;render()}).catch(e=>{qs.innerHTML='<section class="panel">Erro ao carregar as questões: '+clean(e.message)+'. Verifique se index.html e questions.json estão na mesma pasta.</section>';});
</script></body></html>
